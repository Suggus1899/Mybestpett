name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petbf
          POSTGRES_PASSWORD: petbf
          POSTGRES_DB: petbf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petbf"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petbf:petbf@localhost:5432/petbf_test?schema=public
      JWT_ACCESS_SECRET: secreto-solo-para-ci-0123456789abcdef0123456789
      SEED_ADMIN_EMAIL: admin@petbf.local
      SEED_ADMIN_PASSWORD: admin-local-123456
      E2E_ADMIN_EMAIL: admin@petbf.local
      E2E_ADMIN_PASSWORD: admin-local-123456
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter api prisma:deploy
      - run: pnpm --filter api test:e2e
      - run: pnpm build
      # Pruebas de navegador: datos de ejemplo sobre la base ya vaciada por las e2e.
      - run: pnpm --filter api prisma:seed
        env:
          SEED_DEMO: "true"
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petbf
          POSTGRES_PASSWORD: petbf
          POSTGRES_DB: petbf_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petbf"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://petbf:petbf@localhost:5432/petbf_contract?schema=public
      JWT_ACCESS_SECRET: secreto-solo-para-ci-0123456789abcdef0123456789
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test contract
      - run: flutter analyze
      - run: flutter test
      # Contrato: la app contra la API real con datos de ejemplo.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter api prisma:deploy
        working-directory: .
      - run: pnpm --filter api prisma:seed
        working-directory: .
        env:
          SEED_DEMO: "true"
      - run: pnpm --filter api build
        working-directory: .
      - name: Arrancar la API
        working-directory: apps/api
        env:
          PORT: "3001"
          AUTH_THROTTLE_LIMIT: "1000"
          THROTTLE_LIMIT: "100000"
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/v1/health && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - run: flutter test contract
        env:
          CONTRACT_API_URL: http://localhost:3001/v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: petbf-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
